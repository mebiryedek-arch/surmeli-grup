name: Build stable Sürmeli Grup 0.11.3 ZIP

on:
  push:
    branches:
      - stable/0.11.3-package
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify plugin entry point
        run: |
          test -f surmeli-grup.php
          grep -q "Version: 0.11.3" surmeli-grup.php
          grep -q "SG_VERSION', '0.11.3'" surmeli-grup.php
      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Create installable ZIP
        run: |
          mkdir -p dist/surmeli-grup
          git archive HEAD | tar -x -C dist/surmeli-grup
          cd dist
          zip -qr surmeli-grup-0.11.3.zip surmeli-grup
          unzip -l surmeli-grup-0.11.3.zip | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: surmeli-grup-0.11.3-installable
          path: dist/surmeli-grup-0.11.3.zip
          if-no-files-found: error
          retention-days: 30
