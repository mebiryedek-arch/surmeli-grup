name: Build installable Sürmeli Grup 0.13.0 ZIP

on:
  push:
    branches:
      - feature/is-takip-012
      - fix/password-menu-click-20261125
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress plugin directory
        run: |
          mkdir -p dist/surmeli-grup
          git archive HEAD | tar -x -C dist/surmeli-grup
          find dist/surmeli-grup -type d -name .git -prune -exec rm -rf {} +
      - name: PHP syntax check
        run: |
          find dist/surmeli-grup -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Create installable ZIP
        run: |
          cd dist
          zip -qr surmeli-grup-0.13.0.zip surmeli-grup
          unzip -t surmeli-grup-0.13.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: surmeli-grup-0.13.0-installable
          path: dist/surmeli-grup-0.13.0.zip
          if-no-files-found: error
          retention-days: 30
