name: Build tested Sürmeli Grup 0.13.0 ZIP

on:
  push:
    branches:
      - fix/php81-compat-012
      - feature/personnel-tracking-012
      - feature/portal-pwa-header-0122
      - fix/password-menu-click-20261125
  pull_request:
    branches:
      - fix/php81-compat-012
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set minimum supported PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Verify plugin and report entry points
        run: |
          test -f surmeli-grup.php
          grep -q "Version: 0.13.0" surmeli-grup.php
          grep -q "SG_DB_VERSION', '1.7.0'" surmeli-grup.php
          test -f modules/reports/class-reports.php
          test -f assets/js/reports.js
          test -f assets/css/reports.css
          test -f database/migrations/008-personnel-tracking.php
      - name: PHP 8.1 syntax check
        run: |
          php -v
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: |
          node --check assets/js/app.js
          node --check assets/js/reports.js
      - name: Create and verify installable ZIP
        run: |
          mkdir -p dist/surmeli-grup
          git archive HEAD | tar -x -C dist/surmeli-grup
          cd dist
          zip -qr surmeli-grup-0.13.0.zip surmeli-grup
          unzip -t surmeli-grup-0.13.0.zip
          unzip -l surmeli-grup-0.13.0.zip | grep -E 'surmeli-grup/(surmeli-grup.php|modules/reports/class-reports.php|assets/js/reports.js|assets/css/reports.css)$'
      - uses: actions/upload-artifact@v4
        with:
          name: surmeli-grup-0.13.0-php81-tested
          path: dist/surmeli-grup-0.13.0.zip
          if-no-files-found: error
          retention-days: 30
