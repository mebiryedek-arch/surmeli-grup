name: Build tested Sürmeli Grup 0.12.0 ZIP

on:
  push:
    branches:
      - feature/is-takip-012-safe
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify plugin and migration entry points
        run: |
          test -f surmeli-grup.php
          grep -q "Version: 0.12.0" surmeli-grup.php
          grep -q "SG_DB_VERSION', '1.6.0'" surmeli-grup.php
          test -f database/migrations/007-job-tracking.php
      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: node --check assets/js/app.js
      - name: Create installable ZIP
        run: |
          mkdir -p dist/surmeli-grup
          git archive HEAD | tar -x -C dist/surmeli-grup
          cd dist
          zip -qr surmeli-grup-0.12.0.zip surmeli-grup
          unzip -t surmeli-grup-0.12.0.zip
          unzip -l surmeli-grup-0.12.0.zip | grep -E 'surmeli-grup/(surmeli-grup.php|database/migrations/007-job-tracking.php)$'
      - uses: actions/upload-artifact@v4
        with:
          name: surmeli-grup-0.12.0-tested
          path: dist/surmeli-grup-0.12.0.zip
          if-no-files-found: error
          retention-days: 30
